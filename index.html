<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Sinha Family Tree</title>
  <style>
    :root {
      --leaf-bg: #e8f5e9;
      --leaf-border: #2e7d32;
      --accent: #1b5e20;
      --gold: #c9a227;
      --text: #1a1a1a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f1f8e9;
      color: var(--text);
      overflow: hidden;
    }

    /* ========== SPLASH ========== */
    #splash {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, #e8f5e9 0%, #c8e6c9 45%, #a5d6a7 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s ease, visibility 0.5s;
      padding: 1rem;
    }
    #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-tree {
      width: min(90vw, 420px);
      max-height: 48vh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.28);
      background: #c8e6c9;
    }
    .splash-title {
      margin-top: 1.1rem;
      font-size: clamp(1.9rem, 6.5vw, 2.8rem);
      font-weight: 700;
      color: var(--accent);
      text-shadow: 1px 1px 0 #fff;
      letter-spacing: 0.5px;
    }
    .splash-btn {
      margin-top: 1.3rem;
      padding: 0.85rem 2.3rem;
      font-size: 1.15rem;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(27,94,32,0.4);
      -webkit-tap-highlight-color: transparent;
    }
    .splash-btn:active { transform: scale(0.97); }
    .splash-credit {
      position: absolute;
      bottom: 1rem;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.82rem;
      color: #33691e;
    }

    /* ========== MAIN ========== */
    #app {
      display: none;
      height: 100%;
      flex-direction: column;
      position: relative;
    }
    #app.active { display: flex; }

    header {
      background: rgba(232,245,233,0.97);
      padding: 0.55rem 0.7rem;
      border-bottom: 2px solid var(--leaf-border);
      z-index: 50;
      display: flex; align-items: center; gap: 0.5rem;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.1rem; color: var(--accent); flex: 1; min-width: 100px; }
    .start-with { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
    .start-with label { font-weight: 600; color: var(--accent); font-size: 0.88rem; }
    select#personSelect {
      padding: 0.38rem 0.55rem;
      border: 2px solid var(--leaf-border);
      border-radius: 8px;
      background: #fff;
      font-size: 0.88rem;
      max-width: 210px;
    }
    .controls { display: flex; gap: 0.3rem; }
    .controls button {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 2px solid var(--leaf-border);
      background: #fff;
      font-size: 1rem;
      cursor: pointer;
      color: var(--accent);
      font-weight: bold;
      display: flex; align-items: center; justify-content: center;
    }
    .controls button.close-btn { border-color: #c62828; color: #c62828; }

    /* ========== VIEWPORT (zoom + pan) ========== */
    #viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      z-index: 1;
      cursor: grab;
      touch-action: none;
      background: rgba(241,248,233,0.5);
    }
    #viewport.grabbing { cursor: grabbing; }

    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      min-height: 100%;
      transform-origin: 0 0;
      padding: 20px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }

    /* ========== NAV ARROWS ========== */
    .nav-arrow {
      position: absolute;
      right: 10px;
      width: 50px; height: 50px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      background: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
    #btnUp { top: 12%; }
    #btnDown { bottom: 14%; }

    /* ========== REALISTIC BANYAN / PEEPAL LEAF ========== */
    .leaf {
      width: min(72vw, 220px);
      height: min(90vw, 280px);
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      text-align: center;
      position: relative;
      margin: 0 auto;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    /* Realistic leaf image as the shape */
    .leaf::before {
      content: '';

    .leaf::after {
      display: none;
    }
    .leaf-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18% 12% 22%;
      width: 100%;
      height: 100%;
      justify-content: center;
      box-sizing: border-box;
    }

    .photo-circle {
      width: 72px; height: 72px;
      margin: 0 auto 0.45rem;
      border-radius: 50%;
      background: linear-gradient(145deg, #e8f5e9, #a5d6a7);
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.45rem;
      font-weight: 700;
      color: #1b5e20;
      text-shadow: none;
      overflow: hidden;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }
    .photo-circle img { width: 100%; height: 100%; object-fit: cover; }

    .leaf-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 0.2rem;
      position: relative;
      z-index: 2;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7), 0 0 8px rgba(0,0,0,0.4);
    }
    .leaf-dob {
      font-size: 0.78rem;
      color: #FFEB3B;
      position: relative;
      z-index: 2;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    .leaf-dob span { font-weight: 600; color: #FFEB3B; }

    /* Couple side-by-side – ALWAYS one single row */
    .couple-row {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: flex-start;
      gap: 6px;
      width: 100%;
      max-width: 100%;
      padding: 0 4px;
    }
    .couple-row .leaf {
      width: min(40vw, 165px);
      height: min(52vw, 210px);
      flex-shrink: 0;
    }
    .couple-row .photo-circle {
      width: 52px; height: 52px;
      font-size: 1.1rem;
      border-width: 2.5px;
    }
    .couple-row .leaf-name { font-size: 0.78rem; line-height: 1.15; }
    .couple-row .leaf-dob { font-size: 0.68rem; }
    .couple-row .leaf-content {
      padding: 16% 10% 20%;
    }
    .couple-heart {
      align-self: center;
      font-size: 1.25rem;
      color: #c62828;
      flex-shrink: 0;
      margin: 0 2px;
      padding-top: 40px;
    }

    /* Relatives panels */
    .rel-section {
      width: 100%;
      max-width: 520px;
      margin-top: 1.2rem;
      background: rgba(255,255,255,0.82);
      border-radius: 14px;
      border: 1px solid #c8e6c9;
      padding: 0.7rem;
    }
    .rel-section h3 {
      font-size: 0.9rem;
      color: var(--accent);
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .rel-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      justify-content: center;
    }
    .rel-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.4rem 0.5rem;
      background: #fff;
      border: 2px solid var(--leaf-border);
      border-radius: 12px;
      cursor: pointer;
      min-width: 86px;
      -webkit-tap-highlight-color: transparent;
    }
    .rel-chip:active { transform: scale(0.96); }
    .rel-chip .mini-photo {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #81c784;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.2rem;
      overflow: hidden;
    }
    .rel-chip .mini-name {
      font-size: 0.7rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.15;
      max-width: 78px;
    }
    .rel-chip .mini-rel {
      font-size: 0.62rem;
      color: #666;
      margin-top: 0.1rem;
    }

    .empty-hint {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #555;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    /* Exit popup */
    #exitPopup {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 2000;
      align-items: center; justify-content: center;
      padding: 1rem;
    }
    #exitPopup.show { display: flex; }
    .popup-box {
      background: #fff;
      border-radius: 18px;
      padding: 1.7rem 1.4rem;
      max-width: 340px;
      text-align: center;
      border: 3px solid var(--gold);
      box-shadow: 0 12px 36px rgba(0,0,0,0.3);
    }
    .popup-box .hindi {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .popup-box p { font-size: 1.05rem; color: #333; margin-bottom: 1.1rem; }
    .popup-box button {
      padding: 0.5rem 1.4rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 28px;
      font-size: 0.95rem;
      cursor: pointer;
      margin: 0 0.25rem;
    }
    .popup-box button.secondary { background: #757575; }

    footer {
      text-align: center;
      padding: 0.4rem;
      font-size: 0.75rem;
      color: #558b2f;
      background: rgba(232,245,233,0.95);
      border-top: 1px solid #c8e6c9;
      z-index: 10;
      flex-shrink: 0;
    }
  
    /* old modal css suppressed */
    .detail-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 30, 10, 0.72);
      z-index: 5000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    .detail-overlay.open {
      display: flex;
    }
    .detail-card {
      background: linear-gradient(160deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
      border-radius: 24px;
      padding: 1.75rem 1.5rem 1.5rem;
      max-width: 340px;
      width: 92%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      position: relative;
      border: 3px solid #2e7d32;
    }
    .detail-close {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: #c62828;
      color: #fff;
      font-size: 1.4rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 40px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      z-index: 20;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }
    .detail-photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      margin: 0.5rem auto 1rem;
      border: 5px solid #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);

      var chips = canvas.querySelectorAll(".rel-chip");
      for (var i = 0; i < chips.length; i++) {
        chips[i].addEventListener("click", function () {
          selectPerson(this.getAttribute("data-id"));
        });
      }
      /* Wire leaves — tap opens detail screen */
      var leaves = canvas.querySelectorAll(".leaf");
      for (var j = 0; j < leaves.length; j++) {
        leaves[j].style.cursor = "pointer";
        leaves[j].addEventListener("click", function (e) {
          e.stopPropagation();
          showPersonDetail(this.getAttribute("data-id"));
        });
      }

      document.getElementById("btnUp").disabled = upList.length === 0;
      document.getElementById("btnDown").disabled = downList.length === 0;
      var _ps = document.getElementById("personSearch");
      if (_ps && people[id]) _ps.value = people[id].name;

      /* Reset pan so content is visible */
      panX = 0; panY = 0; scale = 1;
      applyTransform();
    }


        function showPersonDetail(id) {
      var p = people[id];
      if (!p) return;
      var photoEl = document.getElementById("detailPhoto");
      if (p.photo) {
        photoEl.innerHTML = '<img src="' + p.photo + '" alt="" />';
      } else {
        photoEl.innerHTML = initials(p.name);
      }
      /* Yellow ring on popup for listed people */
      if (yellowCircleIds[id]) {
        photoEl.className = "detail-photo yellow-ring";
      } else {
        photoEl.className = "detail-photo";
      }
      document.getElementById("detailName").textContent = p.name;
      document.getElementById("detailDob").innerHTML = '<span>Date of Birth:</span> ' + (p.dob || "—");
      var ov = document.getElementById("detailOverlay");
      ov.style.display = "flex";
      ov.classList.add("open");
      window.__detailOpen = true;
    }

        function hidePersonDetail() {
      var ov = document.getElementById("detailOverlay");
      if (ov) {
        ov.classList.remove("open");
        ov.style.display = "none";
      }
      window.__detailOpen = false;
    }
    window.hidePersonDetail = hidePersonDetail;


    function selectPerson(id) {
      if (!id || !people[id]) return;
      renderPerson(id);
    }

    function navigate(dir) {
      if (!currentId) return;
      var p = people[currentId];
      if (dir === "up") {
        if (p.parents.length) selectPerson(p.parents[0]);
        else if (p.spouse) selectPerson(p.spouse);
      } else if (dir === "down") {
        if (p.children.length) selectPerson(p.children[0]);
      }
    }

    /* Zoom + Pan */
    function applyTransform() {
      document.getElementById("canvas").style.transform =
        "translate(" + panX + "px," + panY + "px) scale(" + scale + ")";
    }
    function zoomBy(delta) {
      var old = scale;
      scale = Math.min(2.5, Math.max(0.5, scale + delta));
      var vp = document.getElementById("viewport");
      var cy = vp.clientHeight / 2;
      var cx = vp.clientWidth / 2;
      panX = cx - (cx - panX) * (scale / old);
      panY = cy - (cy - panY) * (scale / old);
      if (scale <= 1.05) { scale = 1; panX = 0; }
      applyTransform();
    }
    function resetView() {
      scale = 1; panX = 0; panY = 0;
      applyTransform();
    }

        function touchDistance(t) {
      var dx = t[0].clientX - t[1].clientX;
      var dy = t[0].clientY - t[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }
    function onPointerDown(e) {
      if (e.touches && e.touches.length === 2) {
        isPinching = true;
        isDragging = false;
        pinchStartDist = touchDistance(e.touches);
        pinchStartScale = scale;
        return;
      }
      isDragging = true;
      isPinching = false;
      document.getElementById("viewport").classList.add("grabbing");
      var pt = e.touches ? e.touches[0] : e;
      startX = pt.clientX; startY = pt.clientY;
      startPanX = panX; startPanY = panY;
    }
    function onPointerMove(e) {
      if (e.touches && e.touches.length === 2) {
        e.preventDefault();
        isPinching = true;
        isDragging = false;
        if (!pinchStartDist) {
          pinchStartDist = touchDistance(e.touches);
          pinchStartScale = scale;
        }
        var dist = touchDistance(e.touches);
        var next = pinchStartScale * (dist / pinchStartDist);
        scale = Math.min(2.5, Math.max(0.5, next));
        applyTransform();
        return;
      }
      if (!isDragging || isPinching) return;
      e.preventDefault();
      var pt = e.touches ? e.touches[0] : e;
      /* Without zoom: vertical scroll only. When zoomed: free pan. */
      if (scale <= 1.05) {
        panX = 0;
        panY = startPanY + (pt.clientY - startY);
      } else {
        panX = startPanX + (pt.clientX - startX);
        panY = startPanY + (pt.clientY - startY);
      }
      applyTransform();
    }
    function onPointerUp(e) {
      if (e.touches && e.touches.length >= 1) {
        /* still one finger left after pinch */
        if (e.touches.length === 1) {
          isPinching = false;
          pinchStartDist = 0;
          isDragging = true;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          startPanX = panX;
          startPanY = panY;
        }
        return;
      }
      isDragging = false;
      isPinching = false;
      pinchStartDist = 0;
      document.getElementById("viewport").classList.remove("grabbing");
    }
    function onWheel(e) {
      e.preventDefault();
      zoomBy(e.deltaY > 0 ? -0.1 : 0.1);
    }

    function enterApp() {
      document.getElementById("splash").classList.add("hidden");
      document.getElementById("app").classList.add("active");
      populateDropdown();

      var vp = document.getElementById("viewport");
      vp.addEventListener("mousedown", onPointerDown);
      window.addEventListener("mousemove", onPointerMove);
      window.addEventListener("mouseup", onPointerUp);
      vp.addEventListener("touchstart", onPointerDown, { passive: false });
      window.addEventListener("touchmove", onPointerMove, { passive: false });
      window.addEventListener("touchend", onPointerUp);
      vp.addEventListener("wheel", onWheel, { passive: false });
    }

    var allNameIds = [];
    function populateDropdown() {
      allNameIds = Object.keys(people).sort(function (a, b) {
        return people[a].name.localeCompare(people[b].name);
      });
    }
    function renderNameDropdown(filter) {
      var dd = document.getElementById("nameDropdown");
      if (!dd) return;
      var q = (filter || "").trim().toLowerCase();
      var html = "";
      var count = 0;
      for (var i = 0; i < allNameIds.length; i++) {
        var id = allNameIds[i];
        var name = people[id].name;
        if (q && name.toLowerCase().indexOf(q) === -1) continue;
        html += '<div class="name-option" data-id="' + id + '">' + name + '</div>';
        count++;
        if (count >= 40) break;
      }
      if (!html) html = '<div class="name-option" style="color:#888;cursor:default;">No match</div>';
      dd.innerHTML = html;
      dd.classList.add("open");
      var opts = dd.querySelectorAll(".name-option[data-id]");
      function pickName(e) {
        e.preventDefault();
        e.stopPropagation();
        var id = this.getAttribute("data-id");
        if (!id || !people[id]) return;
        var inp = document.getElementById("personSearch");
        if (inp) inp.value = people[id].name;
        dd.classList.remove("open");
        selectPerson(id);
      }
      for (var j = 0; j < opts.length; j++) {
        opts[j].addEventListener("mousedown", pickName);
        opts[j].addEventListener("click", pickName);
        opts[j].addEventListener("touchend", pickName);
      }
    }
    function hideNameDropdown() {
      var dd = document.getElementById("nameDropdown");
      if (dd) dd.classList.remove("open");
    }

    function showExitPopup() { document.getElementById("exitPopup").classList.add("show"); }
    function cancelExit() { document.getElementById("exitPopup").classList.remove("show"); }
    function confirmExit() {
      document.getElementById("exitPopup").classList.remove("show");
      document.getElementById("app").classList.remove("active");
      document.getElementById("splash").classList.remove("hidden");
      currentId = null;
      document.getElementById("canvas").innerHTML =
        '<div class="empty-hint">Select a family member from<br><b>Start With</b> dropdown above<br>to view their leaf on the Bargad Tree.</div>';
      var _ps2 = document.getElementById("personSearch"); if (_ps2) _ps2.value = "";
      document.getElementById("btnUp").disabled = true;
      document.getElementById("btnDown").disabled = true;
    }

    /* Bind events */
    document.getElementById("enterBtn").addEventListener("click", enterApp);
    var searchInput = document.getElementById("personSearch");
    if (searchInput) {
      searchInput.addEventListener("focus", function () {
        renderNameDropdown(this.value);
      });
      searchInput.addEventListener("input", function () {
        renderNameDropdown(this.value);
      });
      searchInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          var dd = document.getElementById("nameDropdown");
          var first = dd && dd.querySelector(".name-option[data-id]");
          if (first) {
            var id = first.getAttribute("data-id");
            searchInput.value = people[id].name;
            hideNameDropdown();
            selectPerson(id);
          }
        } else if (e.key === "Escape") {
          hideNameDropdown();
        }
      });
      document.addEventListener("click", function (e) {
        var wrap = document.querySelector(".name-search-wrap");
        if (wrap && !wrap.contains(e.target)) hideNameDropdown();
      });
    }
    document.getElementById("btnUp").addEventListener("click", function () { navigate("up"); });
    document.getElementById("btnDown").addEventListener("click", function () { navigate("down"); });
    document.getElementById("zoomInBtn").addEventListener("click", function () { zoomBy(0.15); });
    document.getElementById("zoomOutBtn").addEventListener("click", function () { zoomBy(-0.15); });
    document.getElementById("resetBtn").addEventListener("click", resetView);
    document.getElementById("closeBtn").addEventListener("click", showExitPopup);
    document.getElementById("confirmExitBtn").addEventListener("click", confirmExit);
    document.getElementById("cancelExitBtn").addEventListener("click", cancelExit);
    

            
    
    
    function bindDetailClose() {
      var ov = document.getElementById("detailOverlay");
      var card = document.getElementById("detailCard");
      var x = document.getElementById("detailX");

      function closeIt(e) {
        if (e) {
          try { e.preventDefault(); } catch (err) {}
          try { e.stopPropagation(); } catch (err) {}
        }
        hidePersonDetail();
        return false;
      }

      /* Red X — multiple event types for mobile */
      if (x) {
        ["click", "touchend", "touchstart", "mouseup"].forEach(function (evt) {
          x.addEventListener(evt, function (e) {
            closeIt(e);
          }, true);
        });
        x.setAttribute("onclick", "hidePersonDetail();return false;");
      }

      /* Backdrop / dark area */
      var bd = document.getElementById("detailBackdrop");
      if (bd) {
        ["click", "touchend", "touchstart"].forEach(function (evt) {
          bd.addEventListener(evt, closeIt, true);
        });
      }

      /* Any tap on overlay that is NOT inside the leaf card */
      if (ov) {
        function onOv(e) {
          if (!window.__detailOpen) return;
          if (card && card.contains(e.target)) return;
          closeIt(e);
        }
        ov.addEventListener("click", onOv, true);
        ov.addEventListener("touchend", onOv, true);
      }

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") hidePersonDetail();
      });
    }
    bindDetailClose();





  })();
  </script>

    <div class="detail-overlay" id="detailOverlay">
    <div class="detail-backdrop" id="detailBackdrop"></div>
    <div class="detail-card leaf-detail" id="detailCard">
      <div class="detail-photo" id="detailPhoto"></div>
      <div class="detail-name" id="detailName"></div>
      <div class="detail-dob" id="detailDob"></div>
      </div>
    <button type="button" class="detail-x" id="detailX" aria-label="Close">✕</button>
  </div>
</body>
</html>
